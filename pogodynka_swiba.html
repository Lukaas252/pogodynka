<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Pogoda • Świba</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#f2f6ff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}main{padding:20px 18px 25px;max-width:520px;margin:auto}.top{display:flex;justify-content:space-between;align-items:start}.place{font-size:21px;font-weight:700}.sub,.muted{color:#9eafc8;font-size:12px}#clock{font-size:49px;font-weight:250;letter-spacing:-2px;font-variant-numeric:tabular-nums}.hero{margin:22px 0 15px;display:flex;align-items:center;justify-content:space-between}.temp{font-size:79px;letter-spacing:-6px;font-weight:200;line-height:1}.weather-icon{font-size:64px}.condition{font-size:17px;margin-top:10px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.card{background:#18253a;border:1px solid #25354c;border-radius:13px;padding:12px 9px}.card .v{font-size:20px;margin-top:7px}.section{margin:24px 0 10px;font-size:14px;font-weight:700}.hours{display:flex;gap:8px;overflow-x:auto;padding-bottom:5px}.hour{min-width:68px;text-align:center;background:#18253a;border-radius:12px;padding:12px 5px;font-size:12px}.hour .emoji{font-size:23px;margin:8px 0}.hour strong{font-size:17px}.days{display:flex;flex-direction:column;gap:8px}.day{display:flex;align-items:center;justify-content:space-between;background:#18253a;border-radius:12px;padding:12px;font-size:14px}.day span:first-child{width:78px}.day .symbol{font-size:24px}footer{text-align:center;color:#8293ad;font-size:11px;margin-top:19px}#status{font-size:11px;color:#a4b5cc;margin-top:7px}@media(max-height:700px){main{padding-top:12px}.hero{margin:12px 0}.temp{font-size:65px}.section{margin:15px 0 8px}.card{padding:9px 7px}}</style></head><body><main><div class="top"><div><div class="place">📍 Świba</div><div id="date" class="sub"></div></div><div id="clock">--:--</div></div><div class="hero"><div><div class="temp" id="temp">--°</div><div class="condition" id="condition">Ładowanie pogody…</div><div class="muted" id="feels">Odczuwalna: --°</div></div><div class="weather-icon" id="bigicon">☁️</div></div><div class="cards"><div class="card"><div class="muted">Wilgotność</div><div class="v" id="humidity">--%</div></div><div class="card"><div class="muted">Wiatr</div><div class="v" id="wind">--</div><div class="muted">km/h</div></div><div class="card"><div class="muted">Opady</div><div class="v" id="rain">--%</div><div class="muted">szansa teraz</div></div></div><div class="section">Najbliższe godziny</div><div class="hours" id="hours"></div><div class="section">Prognoza na 3 dni</div><div class="days" id="days"></div><div id="status">Łączenie z serwisem pogodowym…</div><footer>Dane pogodowe: Open-Meteo.com · Aktualizacja co 10 min</footer></main><script>const $=id=>document.getElementById(id);const fmt=new Intl.DateTimeFormat('pl-PL',{timeZone:'Europe/Warsaw',hour:'2-digit',minute:'2-digit'});const df=new Intl.DateTimeFormat('pl-PL',{timeZone:'Europe/Warsaw',weekday:'long',day:'numeric',month:'long'});function tick(){let n=new Date();$('clock').textContent=fmt.format(n);$('date').textContent=df.format(n)}tick();setInterval(tick,1000);function icon(c){if(c===0)return '☀️';if(c<=2)return '🌤️';if(c===3)return '☁️';if(c===45||c===48)return '🌫️';if(c>=51&&c<=67)return '🌧️';if(c>=71&&c<=77)return '🌨️';if(c>=80&&c<=82)return '🌦️';if(c>=95)return '⛈️';return '☁️'}function desc(c){if(c===0)return 'Bezchmurnie';if(c<=2)return 'Częściowe zachmurzenie';if(c===3)return 'Pochmurno';if(c===45||c===48)return 'Mgła';if(c>=51&&c<=67)return 'Deszcz / mżawka';if(c>=71&&c<=77)return 'Śnieg';if(c>=80&&c<=82)return 'Przelotny deszcz';if(c>=95)return 'Burza';return 'Zmienne warunki'}async function load(){try{const url='https://api.open-meteo.com/v1/forecast?latitude=51.28&longitude=18.12&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&hourly=temperature_2m,weather_code,precipitation_probability&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Europe%2FWarsaw&forecast_days=4';let r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);let d=await r.json(),c=d.current;$('temp').textContent=Math.round(c.temperature_2m)+'°';$('condition').textContent=desc(c.weather_code);$('feels').textContent='Odczuwalna: '+Math.round(c.apparent_temperature)+'°';$('bigicon').textContent=icon(c.weather_code);$('humidity').textContent=c.relative_humidity_2m+'%';$('wind').textContent=Math.round(c.wind_speed_10m);let now=d.hourly.time.findIndex(t=>t>=c.time.slice(0,13)+':00');if(now<0)now=0;$('rain').textContent=(d.hourly.precipitation_probability[now]??0)+'%';$('hours').innerHTML=d.hourly.time.slice(now,now+8).map((t,j)=>{let i=now+j;return '<div class="hour"><div>'+t.slice(11,16)+'</div><div class="emoji">'+icon(d.hourly.weather_code[i])+'</div><strong>'+Math.round(d.hourly.temperature_2m[i])+'°</strong><div class="muted">💧'+d.hourly.precipitation_probability[i]+'%</div></div>'}).join('');let names=['niedz.','pon.','wt.','śr.','czw.','pt.','sob.'];$('days').innerHTML=d.daily.time.slice(1,4).map((t,j)=>{let i=j+1;let day=new Date(t+'T12:00:00');return '<div class="day"><span>'+names[day.getDay()]+' '+t.slice(8)+'</span><span class="symbol">'+icon(d.daily.weather_code[i])+'</span><span>'+Math.round(d.daily.temperature_2m_min[i])+'° / <b>'+Math.round(d.daily.temperature_2m_max[i])+'°</b></span></div>'}).join('');$('status').textContent='Zaktualizowano: '+fmt.format(new Date())}catch(e){$('status').textContent='Brak aktualizacji — sprawdź Wi-Fi. Ponawiam automatycznie.'}}load();setInterval(load,600000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});</script></body></html>
